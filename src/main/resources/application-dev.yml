# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# Standard Spring Boot properties. Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    org.hibernate.SQL: DEBUG
    com.peecko.api: DEBUG
    org.springframework.cache: DEBUG

server:
  port: 8080

spring:
  cache:
    type: caffeine
    jcache:
      provider:
  application:
    name: api
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/admin
    username: admin
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
  mail:
    host: smtp.office365.com
    port: 587
    username: info@peecko.com
    password: InfoPeecko@2022
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false
  jmx:
    enabled: false

# ===================================================================
# Application specific properties
# ===================================================================
app:
  api:
    jwtSecret: peeckoSecretKey
    jwtExpirationMs: 36000000

debug: true
